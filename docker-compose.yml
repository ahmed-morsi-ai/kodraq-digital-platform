services:
  db:
    image: postgres:16-alpine
    container_name: kodraq_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kodraq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kodraq_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-kodraq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kodraq_user} -d ${POSTGRES_DB:-kodraq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kodraq-network

  redis:
    image: redis:7-alpine
    container_name: kodraq_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kodraq-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kodraq_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kodraq_user}:${POSTGRES_PASSWORD:-kodraq_secure_password}@db:5432/${POSTGRES_DB:-kodraq_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kodraq-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kodraq_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kodraq-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  kodraq-network:
    driver: bridge
